[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airborne-antara"
version = "0.2.0"
description = "Feedback-driven online and continual learning for PyTorch models."
readme = "README.md"
requires-python = ">=3.10"
# license = {text = "MIT"} # Deprecated table format
license = "MIT"
authors = [
    {name = "Suryaansh Prithvijit Singh", email = "suryaansh@airbornehrs.in"}
]
keywords = [
    "meta-learning",
    "online-learning",
    "continual-learning",
    "adaptive-optimization",
    "production-ml",
    "automl",
    "pytorch",
    "deep-learning",
    "self-healing-systems",
    "neural-networks",
    "model-monitoring"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "torch>=2.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tensorboard>=2.12.0",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "black>=23.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "ruff>=0.9.0",
    "build>=1.2.0"
]

[project.urls]
Homepage = "https://airbornehrs.in"
Documentation = "https://github.com/AirBorneAI/Airborne-Antara#readme"
Repository = "https://github.com/AirBorneAI/Airborne-Antara.git"
Issues = "https://github.com/AirBorneAI/Airborne-Antara/issues"
"Research Paper" = "https://doi.org/10.5281/zenodo.17839490"

[tool.setuptools]
packages = ["airborne_antara"]

[project.scripts]
# `mm` becomes available after `pip install -e .` or packaging
mm = "airborne_antara.__main__:main"

[tool.setuptools.package-data]
airborne_antara = ["*.json", "*.yaml", "*.csv"] 

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Lazy exports are intentionally returned through locals()[name].
"airborne_antara/__init__.py" = ["F401"]
