name: ⚡ AirBorne-Antara CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: 🎨 Lint & Code Style (Ruff & Black)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black flake8

      - name: 🔍 Run Ruff Linter
        run: |
          ruff check airborne_antara tests

      - name: 🔍 Check Code Formatting (Black)
        run: |
          black --check --diff airborne_antara tests

  security-scan:
    name: 🛡️ Security Vulnerability Scan (Bandit & Pip-Audit)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: 🔒 Run Bandit SAST Scan
        run: |
          bandit -r airborne_antara -ll -ii

      - name: 🔒 Run Dependency Vulnerability Audit
        run: |
          pip-audit -r requirements.txt

  test-matrix:
    name: 🧪 Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [lint-and-format]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'

      - name: ⚙️ Install Package in Editable Mode
        run: |
          pip install -e .

      - name: 🔬 Run Unit Tests & Imports Verification
        run: |
          python -c "import airborne_antara; print('AirBorne-Antara initialized successfully:', getattr(airborne_antara, '__version__', 'v8.1'))"
          pytest -v

      - name: 📦 Test Package Build Artifacts (sdist & wheel)
        run: |
          python -m build --sdist --wheel
