name: "👋 First-Time Contributor Welcome Bot"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "⚡ **Welcome to AirBorne-Antara!** 🦅\n\nThank you for opening your first issue in the **AirBorneAI** ecosystem. Our core engineering team will review your report shortly. Please make sure you have checked our [Contributing Guidelines](https://github.com/AirBorneAI/.github/blob/main/CONTRIBUTING.md) and provided all reproduction steps.\n\n*Intelligence. Automation. Elevated.*"
          pr-message: "⚡ **Welcome to AirBorne-Antara!** 🚀\n\nThank you for opening your first Pull Request! Our automated CI gauntlet is now running checks against your changes. A maintainer will review your code shortly.\n\n*BUILT FOR THE FUTURE. ENGINEERED TO LEAD. ELEVATED BY AIRBORNE.*"
