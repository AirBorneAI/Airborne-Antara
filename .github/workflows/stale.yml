name: "🤖 Stale Issues & Pull Requests Bot"

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "⚡ **AirBorne Bot Notice:** This issue has been automatically marked as stale due to 60 days of inactivity. It will be closed in 7 days if no further activity occurs. Thank you for contributing to AirBorne-Antara!"
          stale-pr-message: "⚡ **AirBorne Bot Notice:** This pull request has been automatically marked as stale due to 45 days of inactivity. It will be closed in 7 days if no further activity occurs."
          stale-issue-label: "status: stale"
          stale-pr-label: "status: stale"
          exempt-issue-labels: "status: pinned,status: security,type: epic"
          exempt-pr-labels: "status: pinned,work-in-progress"
          days-before-stale: 60
          days-before-close: 7
